<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รายรับ-รายจ่าย</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--in:#16a34a;--out:#dc2626;--ac:#2563eb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2026;--tx:#eceff3;--mu:#98a2b0;--bd:#2c333b;--in:#4ade80;--out:#f87171;--ac:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Sarabun",system-ui,sans-serif;padding:14px;max-width:560px;margin:auto}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
textarea,input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:6px}
textarea{min-height:90px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;margin-top:8px;cursor:pointer}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px}.row>*{flex:1}
.sum{display:flex;gap:8px;text-align:center}.sum div{flex:1}
.sum small{color:var(--mu);display:block}.sum b{font-size:17px}
.in{color:var(--in)}.out{color:var(--out)}
.it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.it:first-child{border-top:0}.it small{color:var(--mu)}
.x{background:none;color:var(--mu);margin:0;padding:6px}
</style>
</head>
<body>
<h1>💰 รายรับ-รายจ่าย</h1>

<div class="card">
  <input type="month" id="mo">
  <div class="sum" style="margin-top:12px">
    <div><small>รายรับ</small><b class="in" id="si">0</b></div>
    <div><small>รายจ่าย</small><b class="out" id="so">0</b></div>
    <div><small>คงเหลือ</small><b id="sb">0</b></div>
  </div>
</div>

<div class="card">
  <b>เพิ่มรายการ</b>
  <div class="row">
    <select id="ty"><option value="out">รายจ่าย</option><option value="in">รายรับ</option></select>
    <input id="am" type="number" inputmode="decimal" placeholder="จำนวนเงิน">
  </div>
  <div class="row">
    <select id="ct"><option>อาหาร</option><option>เดินทาง</option><option>ช้อปปิ้ง</option><option>บิล/ค่าน้ำไฟ</option><option>เงินเดือน</option><option>อื่นๆ</option></select>
    <input id="dt" type="date">
  </div>
  <input id="nt" placeholder="บันทึก / ร้าน (ไม่บังคับ)">
  <button onclick="add()">บันทึก</button>
</div>

<div class="card"><b>นำเข้าจากไฟล์ที่ Shortcuts บันทึกไว้</b><input id="fl" type="file" accept=".txt,.csv"><small id="st"></small></div>

<div class="card" id="ls"></div>

<script>
let items=[];
const $=id=>document.getElementById(id);
try{items=JSON.parse(localStorage.getItem("ex")||"[]")}catch(e){}
function save(){try{localStorage.setItem("ex",JSON.stringify(items))}catch(e){}}
const now=new Date();
$("mo").value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
$("mo").onchange=render;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
$("dt").value=today();
function ex(s){const m=s.match(/(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)\s*(?:บาท|THB|฿)/i)||s.match(/(?:฿|THB)\s*(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?)/i);const n=s.match(/(?:ไปยัง|ที่|ร้าน|จาก|to|at|from)\s*([^\d\n,]{2,30})/i);return{a:m?parseFloat(m[1].replace(/,/g,"")):0,ty:INW.test(s)?"in":"out",n:n?n[1].trim():s.slice(0,30)}}
function imp(txt){let c=0;txt.split("@@").forEach(r=>{r=r.trim();if(!r)return;const k=r.indexOf("|");let d=k>0?r.slice(0,k).trim():"";if(!/^\d{4}-\d{2}-\d{2}$/.test(d))d=new Date().toISOString().slice(0,10);const b=k>0?r.slice(k+1).trim():r;const h=d+"|"+b;if(items.some(i=>i.h===h))return;const e=ex(b);if(!e.a)return;items.unshift({id:Date.now()+c,d,ty:e.ty,a:e.a,n:e.n,h});c++});save();render();$("st").textContent=" นำเข้า "+c+" รายการใหม่"}
$("fl").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(imp)};
function add(){
  const a=parseFloat($("am").value);
  if(!a)return;
  items.unshift({id:Date.now(),d:$("dt").value||today(),ty:$("ty").value,c:$("ct").value,a,n:$("nt").value});
  items.sort((x,y)=>y.d.localeCompare(x.d)||y.id-x.id);
  save();$("am").value=$("nt").value="";render();
}
function del(id){items=items.filter(i=>i.id!==id);save();render()}
const f=n=>n.toLocaleString("th-TH",{maximumFractionDigits:2});
function render(){
  const mo=$("mo").value;
  const l=items.filter(i=>i.d.startsWith(mo));
  const si=l.filter(i=>i.ty=="in").reduce((x,i)=>x+i.a,0),so=l.filter(i=>i.ty=="out").reduce((x,i)=>x+i.a,0);
  $("si").textContent=f(si);$("so").textContent=f(so);$("sb").textContent=f(si-so);
  $("ls").innerHTML="<b>ประวัติเดือนนี้</b>"+(l.length?l.map(i=>`<div class="it"><div>${esc(i.n||i.c||"-")}<br><small>${i.d}${i.c?" · "+esc(i.c):""}</small></div><div><b class="${i.ty}">${i.ty=="in"?"+":"−"}${f(i.a)}</b><button class="x" onclick="del(${i.id})">✕</button></div></div>`).join(""):"<br><small>ยังไม่มีรายการ</small>");
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const INW=/(รับเงิน|เงินเข้า|โอนเข้า|ได้รับ|ฝากเงิน|รับโอน|deposit|received|credit)/i;
function importText(s){
  const m=s.match(/(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)\s*(?:บาท|THB|฿)/i)||s.match(/(?:฿|THB)\s*(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?)/i);
  if(!m)return false;
  $("am").value=m[1].replace(/,/g,"");
  $("ty").value=INW.test(s)?"in":"out";
  const n=s.match(/(?:ไปยัง|ที่|ร้าน|จาก|to|at|from)\s*([^\d\n,]{2,30})/i);
  $("nt").value=n?n[1].trim():s.slice(0,30);
  $("ct").value=$("ty").value=="in"?"เงินเดือน":"อื่นๆ";
  add();
  return true;
}
const q=new URLSearchParams(location.search).get("t");
if(q){
  const ok=importText(q);
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  if(!ok)alert("แยกจำนวนเงินจากข้อความไม่ได้");
}
render();
</script>
</body>
</html>
